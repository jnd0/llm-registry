name: Update Models.dev Data

on:
  schedule:
    # Run every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest models.dev data
        run: node scripts/import-models-dev.mjs
        env:
          NODE_ENV: production

      - name: Check for changes
        id: git-check
        run: |
          git add src/data/models-dev-import.ts
          if git diff --cached --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate diff summary
        if: steps.git-check.outputs.changes == 'true'
        id: diff-summary
        run: |
          # Get line count changes
          LINES_ADDED=$(git diff --cached --numstat src/data/models-dev-import.ts | awk '{print $1}')
          LINES_REMOVED=$(git diff --cached --numstat src/data/models-dev-import.ts | awk '{print $2}')
          echo "lines_added=$LINES_ADDED" >> $GITHUB_OUTPUT
          echo "lines_removed=$LINES_REMOVED" >> $GITHUB_OUTPUT
          
          # Count models
          MODELS_COUNT=$(grep -c "export const modelsDevMetadata" src/data/models-dev-import.ts || echo "N/A")
          echo "models_count=$MODELS_COUNT" >> $GITHUB_OUTPUT

      - name: Run validation
        if: steps.git-check.outputs.changes == 'true'
        run: npm run validate:data

      - name: Build project
        if: steps.git-check.outputs.changes == 'true'
        run: npm run build

      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(data): update models.dev import (${{ steps.diff-summary.outputs.lines_added }} lines added)'
          signoff: true
          branch: chore/update-models-dev-${{ github.run_number }}
          base: main
          title: 'chore(data): Update models.dev import - ${{ github.event.repository.full_name }}'
          body: |
            ## Automated Models.dev Data Update
            
            This PR was automatically generated by the weekly data sync workflow.
            
            ### Changes
            - Lines added: ${{ steps.diff-summary.outputs.lines_added }}
            - Lines removed: ${{ steps.diff-summary.outputs.lines_removed }}
            - Import date: ${{ github.event.head_commit.timestamp }}
            
            ### Validation
            ✅ Data validation passed
            ✅ Build successful
            
            ### Review Checklist
            - [ ] Verify model count is reasonable
            - [ ] Check for any breaking schema changes
            - [ ] Confirm no data quality issues
            - [ ] Test with sample queries
            
            ---
            
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            *This is an automated PR. Please review the changes carefully.*
          labels: |
            automated-pr
            data-update
          assignees: ''
          reviewers: ''
          draft: false

      - name: No changes detected
        if: steps.git-check.outputs.changes == 'false'
        run: echo "✓ No changes detected in models.dev data"
